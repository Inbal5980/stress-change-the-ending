<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>שנו את הסוף · מודל האינטראקציה של לזרוס</title>
<meta name="description" content="משחק קצר על מודל האינטראקציה של לזרוס: בונים את המודל, ממיינים את המחשבות של הדמות ומשנים את הסוף.">
<meta name="theme-color" content="#5b3fd1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

</div>

<script src="config.js?v=4"></script>
